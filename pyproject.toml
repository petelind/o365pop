[project]
name = "o365pop"
version = "0.1.0"
description = "Graph-to-POP/SMTP bridge for vintage mail clients"
requires-python = ">=3.14"
readme = "README.md"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# Twisted IMailboxPOP3 / cred hooks require camelCase method names.
"o365pop/popd/mailbox.py" = ["N802"]
"o365pop/popd/service.py" = ["N802", "N803", "N815"]
# aiosmtpd handler hooks are handle_AUTH / handle_DATA.
"o365pop/smtpd/handler.py" = ["N802"]
