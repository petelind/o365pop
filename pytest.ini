[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
pythonpath = .
addopts = -v --tb=short --strict-markers -m "not live_graph"
log_cli = true
log_cli_level = INFO
log_file = tests.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (real deps, no mocking)
    log_story: Caplog beat proofs via assert_log_story
    live_graph: Live Microsoft Graph (excluded from make test)
    # Stock Edda markers not registered (SAO §1 / §17):
    # acceptance, e2e, agent_proof, live_llm, quality
