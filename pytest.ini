[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
pythonpath = .
addopts = -v --tb=short --strict-markers
log_cli = true
log_cli_level = INFO
log_file = tests.log
log_file_level = INFO
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (real dependencies)
